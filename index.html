<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lola Operations · Studio Aa</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700,14..32,800&display=swap');
  :root {
    --ink: #141318;
    --gray-1: #55535f;
    --gray-2: #8a8894;
    --line: rgba(20,19,24,.1);
    --line-soft: rgba(20,19,24,.06);
    --bg: #f7f7f8;
    --surface: #ffffff;
    --hover: rgba(20,19,24,.025);
  }
  body.dark {
    --ink: #eeedf1;
    --gray-1: #b8b6c0;
    --gray-2: #817f8a;
    --line: rgba(255,255,255,.1);
    --line-soft: rgba(255,255,255,.06);
    --bg: #17171a;
    --surface: #1e1e22;
    --hover: rgba(255,255,255,.04);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    background: var(--bg); color: var(--ink);
    font-size: 13.5px; font-weight: 400; letter-spacing: -0.006em; line-height: 1.5;
    min-height: 100vh; transition: background .2s ease, color .2s ease;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--line);
  }
  .hdr-left { display: flex; align-items: baseline; gap: 6px; cursor: default; }
  .hdr-word { font-size: 13.5px; font-weight: 700; letter-spacing: -0.02em; cursor: pointer; }
  .hdr-word:hover { color: var(--gray-1); }
  .crumb-sep { color: var(--gray-2); font-size: 12px; }
  .crumb-cur { font-size: 12px; color: var(--gray-2); }
  .hdr-right { display: flex; align-items: center; gap: 16px; }
  .who { font-size: 11px; color: var(--gray-2); }
  .signout {
    font-size: 11px; color: var(--gray-2); background: none; border: none; cursor: pointer;
    font-family: inherit; padding: 0; text-decoration: underline; text-underline-offset: 2px;
  }
  .signout:hover { color: var(--ink); }
  .toggle {
    width: 34px; height: 20px; border-radius: 20px; background: var(--line);
    position: relative; cursor: pointer; border: none; padding: 0; flex-shrink: 0;
    transition: background .18s ease;
  }
  .toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.3);
    transition: transform .18s cubic-bezier(.3,1,.4,1);
  }
  body.dark .toggle { background: var(--ink); }
  body.dark .toggle::after { transform: translateX(14px); background: var(--bg); }

  #app { min-height: calc(100vh - 57px); }

  /* ---------- home: a clean, compact list of pages ---------- */
  .home { max-width: 560px; margin: 0 auto; padding: 48px 28px 80px; }
  .home-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gray-2); margin-bottom: 6px; }
  .home-title { font-size: 23px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 3px; }
  .home-sub { font-size: 11.5px; color: var(--gray-2); margin-bottom: 20px; }
  .page-list {
    display: flex; flex-direction: column; background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  .prow {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; cursor: pointer; font-size: 13px; font-weight: 600;
    user-select: none; border-bottom: 1px solid var(--line-soft);
  }
  .prow:last-child { border-bottom: none; }
  .prow:hover { background: var(--hover); }
  .prow-icon {
    width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; color: var(--gray-2); flex-shrink: 0;
  }
  .prow-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow-meta { font-size: 10.5px; color: var(--gray-2); font-weight: 400; flex-shrink: 0; }
  .prow-del {
    display: none; border: none; background: none; color: var(--gray-2); cursor: pointer;
    font-size: 14px; flex-shrink: 0; line-height: 1;
  }
  .prow:hover .prow-del { display: inline; }
  .prow:hover .prow-meta { display: none; }
  .prow-del:hover { color: var(--ink); }
  .prow-add {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer;
    font-size: 13px; font-weight: 600; color: var(--gray-2);
  }
  .prow-add:hover { background: var(--hover); color: var(--ink); }

  /* ---------- layout: sidebar + main (job sheet's internal categories) ---------- */
  .shell { display: flex; min-height: calc(100vh - 57px); }
  nav {
    width: 200px; flex-shrink: 0; border-right: 1px solid var(--line);
    padding: 18px 10px;
  }
  .cat {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px;
    font-size: 12.5px; color: var(--gray-1); cursor: pointer; user-select: none;
    justify-content: space-between;
  }
  .cat:hover { background: var(--hover); color: var(--ink); }
  .cat.on { background: var(--hover); color: var(--ink); font-weight: 600; }
  .cat-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-n { font-size: 10.5px; color: var(--gray-2); flex-shrink: 0; }
  .cat-del {
    display: none; border: none; background: none; color: var(--gray-2); cursor: pointer;
    font-size: 12px; flex-shrink: 0; line-height: 1; padding: 0 2px;
  }
  .cat:hover .cat-del { display: inline; }
  .cat:hover .cat-n { display: none; }
  .cat-del:hover { color: var(--ink); }
  .cat-add {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px;
    font-size: 12.5px; color: var(--gray-2); cursor: pointer; margin-top: 4px;
  }
  .cat-add:hover { background: var(--hover); color: var(--ink); }

  main { flex: 1; min-width: 0; padding: 28px 32px 80px; }
  .page-title { font-size: 19px; font-weight: 700; letter-spacing: -0.025em; margin-bottom: 3px; }
  .page-sub { font-size: 11.5px; color: var(--gray-2); margin-bottom: 20px; }

  /* ---------- the table, shared by job-sheet categories and standalone pages ---------- */
  .table-wrap {
    border: 1px solid var(--line); border-radius: 9px; overflow: auto; background: var(--surface);
    max-width: 100%;
  }
  table { border-collapse: collapse; width: max-content; min-width: 100%; }
  th, td {
    padding: 8px 13px; border-bottom: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft);
    text-align: left; font-size: 12px; vertical-align: middle; white-space: nowrap;
  }
  th:last-child, td:last-child { border-right: none; }
  tbody tr:last-child td { border-bottom: none; }
  th {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--gray-2); background: var(--surface); position: sticky; top: 0;
  }
  th[contenteditable] { cursor: text; outline: none; }
  th[contenteditable]:focus { color: var(--ink); }
  tbody tr:hover td { background: var(--hover); }
  td[contenteditable] {
    outline: none; cursor: text; min-width: 60px; max-width: 320px;
    white-space: normal; word-break: break-word;
  }
  td[contenteditable]:focus { box-shadow: inset 0 0 0 1.5px var(--ink); border-radius: 3px; }
  td[contenteditable]:empty::before { content: attr(data-ph); color: var(--gray-2); }

  .col-addbtn { width: 30px; text-align: center; cursor: pointer; color: var(--gray-2); user-select: none; }
  .col-addbtn:hover { color: var(--ink); background: var(--hover); }
  .row-del-cell { width: 28px; text-align: center; padding: 0; position: sticky; right: 0; background: var(--surface); }
  .row-del {
    opacity: 0; width: 20px; height: 20px; border: none; background: none; cursor: pointer;
    color: var(--gray-2); font-size: 13px; line-height: 1; transition: opacity .12s ease;
  }
  tr:hover .row-del { opacity: 1; }
  .row-del:hover { color: var(--ink); }

  .add-row {
    display: flex; align-items: center; gap: 8px; padding: 9px 13px; font-size: 11.5px;
    color: var(--gray-2); cursor: pointer; user-select: none;
  }
  .add-row:hover { color: var(--ink); background: var(--hover); }

  /* ---------- doc pages (rich content: headings, tables, nested lists) ---------- */
  .doc { max-width: 720px; margin: 0 auto; padding: 40px 32px 100px; }
  .doc-h2 { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 10px; outline: none; }
  .doc-h3 { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; margin: 22px 0 8px; outline: none; }
  .doc-p { font-size: 12.5px; color: var(--gray-1); line-height: 1.6; margin-bottom: 4px; outline: none; }
  .doc-p strong { color: var(--ink); }
  .doc-p em { font-style: italic; color: var(--gray-2); }
  .doc-hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
  .doc-ul { list-style: none; margin: 2px 0 4px; padding: 0; }
  .doc-ul .doc-ul { margin: 2px 0 2px 18px; }
  .doc-li {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    padding: 3px 0 3px 15px; font-size: 12.5px; line-height: 1.55; position: relative;
  }
  .doc-li::before { content: '\2022'; position: absolute; left: 0; color: var(--gray-2); }
  .doc-li.sub { font-size: 11.5px; color: var(--gray-2); }
  .doc-li.sub::before { content: '\2013'; }
  .doc-li-text { outline: none; flex: 1; }
  .doc-li-text strong { color: var(--ink); }
  .doc-li-del {
    opacity: 0; border: none; background: none; color: var(--gray-2); cursor: pointer;
    font-size: 13px; line-height: 1; flex-shrink: 0; transition: opacity .12s ease;
  }
  .doc-li:hover .doc-li-del { opacity: 1; }
  .doc-li-del:hover { color: var(--ink); }
  .doc-additem, .doc-addblock {
    font-size: 11px; color: var(--gray-2); cursor: pointer; padding: 4px 0 4px 15px; user-select: none;
  }
  .doc-additem:hover, .doc-addblock:hover { color: var(--ink); }
  .doc-table { margin: 4px 0 6px; }

  @media (max-width: 760px) {
    .shell { flex-direction: column; }
    nav { width: 100%; border-right: none; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; gap: 2px; }
    .cat-add { margin-top: 0; }
    main { padding: 20px 16px 60px; }
    .home { padding: 36px 18px 60px; }
    .doc { padding: 30px 18px 60px; }
  }

  /* ---------- import / onboarding modal ---------- */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(20,19,24,.35);
    align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-backdrop.show { display: flex; }
  .modal-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 22px; width: 100%; max-width: 480px; box-shadow: 0 12px 40px rgba(0,0,0,.18);
  }
  .modal-title { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
  .modal-hint { font-size: 11.5px; color: var(--gray-2); line-height: 1.5; margin-bottom: 14px; }
  .modal-input, .modal-textarea {
    width: 100%; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--ink); font-family: inherit;
  }
  .modal-input { margin-bottom: 8px; }
  .modal-input:focus, .modal-textarea:focus { outline: none; border-color: var(--gray-1); }
  .modal-textarea { min-height: 160px; font-size: 12px; resize: vertical; line-height: 1.5; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .modal-btn {
    font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); cursor: pointer; font-family: inherit;
  }
  .modal-btn:hover { background: var(--hover); }
  .modal-btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .modal-btn.primary:hover { opacity: .85; }
</style>
</head>
<body>
<header>
  <div class="hdr-left">
    <span class="hdr-word" onclick="goHome()">Studio Aa</span>
    <span id="crumb"></span>
  </div>
  <div class="hdr-right">
    <span class="who" id="who"></span>
    <button class="signout" id="signout-btn" onclick="signOut()" style="display:none;">sign out</button>
    <button class="toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode"></button>
  </div>
</header>

<div id="app"></div>

<div class="modal-backdrop" id="import-backdrop" onclick="if(event.target===this) closeImport()">
  <div class="modal-card">
    <div class="modal-title">Import a page</div>
    <div class="modal-hint">Paste a spreadsheet/CSV export for a table, or notes and doc text for a written page &mdash; it'll figure out which.</div>
    <input class="modal-input" id="import-name" placeholder="Page name" />
    <textarea class="modal-textarea" id="import-text" placeholder="Paste your notes, doc, or sheet here&hellip;"></textarea>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeImport()">Cancel</button>
      <button class="modal-btn primary" onclick="submitImport()">Create page</button>
    </div>
  </div>
</div>

<script>
  /* ---------- theme ---------- */
  function applyTheme() {
    document.body.classList.toggle('dark', localStorage.getItem('hq_theme') === 'dark');
  }
  function toggleTheme() {
    const dark = document.body.classList.toggle('dark');
    localStorage.setItem('hq_theme', dark ? 'dark' : 'light');
  }
  applyTheme();

  /* ---------- who's signed in ---------- */
  fetch('/api/me').then(r => r.ok ? r.json() : null).then(me => {
    if (!me) return;
    document.getElementById('who').textContent = me.name || me.email || '';
    document.getElementById('signout-btn').style.display = '';
  }).catch(() => {});
  function signOut() {
    fetch('/api/logout', { method: 'POST' }).then(() => window.location.href = '/login.html');
  }

  function esc(s) { return (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  /* =====================================================================
     IMPORT / ONBOARDING: paste in whatever you already track things with
     — a CSV/sheet export or plain notes/doc text — and it builds a real
     page from it. Same "starts blank, grows with real work" idea, just
     seeded from your own material instead of typed in cell by cell.
     ===================================================================== */
  function mdInline(s) {
    s = esc(s);
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
    return s;
  }
  function splitDelim(line, delim) {
    const out = []; let cur = ''; let q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { q = !q; continue; }
      if (c === delim && !q) { out.push(cur); cur = ''; continue; }
      cur += c;
    }
    out.push(cur);
    return out.map(x => x.trim());
  }
  function looksTabular(lines) {
    const sample = lines.filter(l => l.trim()).slice(0, 5);
    if (sample.length < 2) return false;
    const delim = sample[0].includes('\t') ? '\t' : (sample[0].includes(',') ? ',' : null);
    if (!delim) return false;
    const counts = sample.map(l => splitDelim(l, delim).length);
    return counts[0] > 1 && counts.every(n => n === counts[0]);
  }
  function parseAsTable(text) {
    const lines = text.split('\n').filter(l => l.trim().length);
    const delim = lines[0].includes('\t') ? '\t' : ',';
    const cols = splitDelim(lines[0], delim);
    const rows = lines.slice(1).map(l => splitDelim(l, delim));
    return { cols: cols, rows: rows.length ? rows : [cols.map(() => '')] };
  }
  function parseAsDoc(text) {
    const blocks = [];
    let list = null;
    let para = [];
    function flushPara() {
      if (para.length) { blocks.push({ t: 'p', html: mdInline(para.join(' ')) }); para = []; }
    }
    text.split('\n').forEach(raw => {
      const line = raw.replace(/\r$/, '');
      if (!line.trim()) { flushPara(); list = null; return; }
      if (/^-{3,}$/.test(line.trim())) { flushPara(); list = null; blocks.push({ t: 'hr' }); return; }
      const h3 = line.match(/^##+\s+(.*)/);
      const h2 = line.match(/^#\s+(.*)/);
      const li = line.match(/^(\s*)[-*]\s+(.*)/);
      if (h3) { flushPara(); list = null; blocks.push({ t: 'h3', html: mdInline(h3[1]) }); return; }
      if (h2) { flushPara(); list = null; blocks.push({ t: 'h2', html: mdInline(h2[1]) }); return; }
      if (li) {
        flushPara();
        const indented = li[1].length >= 2;
        if (!list) { list = { t: 'ul', items: [] }; blocks.push(list); }
        if (indented && list.items.length) {
          const last = list.items[list.items.length - 1];
          last.sub = last.sub || [];
          last.sub.push({ html: mdInline(li[2]) });
        } else {
          list.items.push({ html: mdInline(li[2]) });
        }
        return;
      }
      list = null;
      para.push(line.trim());
    });
    flushPara();
    if (!blocks.length) blocks.push({ t: 'p', html: 'Type something\u2026' });
    return blocks;
  }
  function openImport() {
    document.getElementById('import-name').value = '';
    document.getElementById('import-text').value = '';
    document.getElementById('import-backdrop').classList.add('show');
    setTimeout(() => document.getElementById('import-name').focus(), 0);
  }
  function closeImport() { document.getElementById('import-backdrop').classList.remove('show'); }
  function submitImport() {
    const nameEl = document.getElementById('import-name');
    const textEl = document.getElementById('import-text');
    const name = nameEl.value.trim();
    const text = textEl.value;
    if (!name) { nameEl.focus(); return; }
    if (!text.trim()) { textEl.focus(); return; }
    const key = name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + Date.now().toString(36).slice(-4);
    const lines = text.split('\n');
    let page;
    if (looksTabular(lines)) {
      const t = parseAsTable(text);
      page = { key: key, label: name, type: 'table', cols: t.cols, rows: t.rows };
    } else {
      page = { key: key, label: name, type: 'doc', blocks: parseAsDoc(text) };
    }
    pages.push(page);
    savePages();
    closeImport();
    openPage(key);
  }

  /* =====================================================================
     HOME: the "Lola Operations" hub — a flat list of pages, same shape as
     the Notion list view it's meant to replace. "job sheet" is a group
     (it opens the categorized job-sheet tables below); everything else
     starts as a single blank table you fill in as that work shows up.
     ===================================================================== */
  const SEED_PAGES = [
    { key: 'job-sheet', label: 'job sheet', type: 'group' },
    { key: 'rate-sheet', label: 'rate sheet', type: 'doc', blocks: [
      { t: 'h2', html: 'Lola Dement Myers: Current Rate Theory (Q1 2026)' },
      { t: 'p', html: '<strong>Overview:</strong> These rates reflect a multidisciplinary practice across photography, design, and performance, supported by a total reach of 20k+ and a proven portfolio of high-level execution.' },
      { t: 'hr' },
      { t: 'h3', html: 'Social Media &amp; Promotion' },
      { t: 'p', html: '<em>Rates are per individual post/frame. Bundling available upon request.</em>' },
      { t: 'table', cols: ['Category', 'Story Post', 'Feed Post'], rows: [
        ['<strong>Corporate / Brand</strong>', '$450', '$2,000 \u2013 $2,500+'],
        ['<strong>Creative Peer / Colleague</strong>', '$250', '$1,000 \u2013 $1,250'],
        ['<strong>Friend / Direct Alignment</strong>', '$150', '$1,000']
      ] },
      { t: 'hr' },
      { t: 'h3', html: 'Photography &amp; Image Consulting' },
      { t: 'ul', items: [
        { html: '<strong>Standard Editorial Image:</strong> $500 (Baseline)' },
        { html: '<strong>Shoot Day Minimum (Standard):</strong> $1,500' },
        { html: '<strong>Shoot Day Minimum (Corporate):</strong> $3,500' },
        { html: '<strong>Hourly Revision/Editing Fee:</strong> $200 / hour' }
      ] },
      { t: 'hr' },
      { t: 'h3', html: 'Creative Direction &amp; Design' },
      { t: 'ul', items: [
        { html: '<strong>Album Cover Design:</strong> $5,000 minimum', sub: [
          { html: '<em>Subject to scale based on artist reach and label backing.</em>' }
        ] },
        { html: '<strong>Standard Flyer Design:</strong> $1,000' },
        { html: '<strong>Friend/Affiliate Flyer Design:</strong> $600 \u2013 $850' },
        { html: '<strong>Editorial Images (Publications):</strong>', sub: [
          { html: '<strong>High-Scale:</strong> $1,000 per image' },
          { html: '<strong>Indie / New Magazine:</strong> $500 per image' }
        ] }
      ] },
      { t: 'hr' },
      { t: 'h3', html: 'Performances &amp; Music Video' },
      { t: 'ul', items: [
        { html: '<strong>Music Video Direction (Minimum):</strong> $5,000', sub: [
          { html: '<em>Excludes equipment/rentals.</em>' },
          { html: '<strong>Major Label / Backed:</strong> $10,000+' },
          { html: '<strong>Independent:</strong> $3,000 \u2013 $5,000' }
        ] },
        { html: '<strong>Live Physical Performance:</strong>', sub: [
          { html: '<strong>Corporate:</strong> $3,000' },
          { html: '<strong>Friend / Peer:</strong> $1,000 \u2013 $1,500' }
        ] }
      ] }
    ] },
    { key: 'sex-talk-hub', label: 'sex talk', type: 'table', cols: ['Item', 'Status', 'Notes'], rows: [['', '', '']] },
    { key: 'schedule', label: 'schedule', type: 'table', cols: ['Item', 'Status', 'Notes'], rows: [['', '', '']] },
    { key: 'management', label: 'management', type: 'table', cols: ['Item', 'Status', 'Notes'], rows: [['', '', '']] },
    { key: 'lead-gen', label: 'lead gen', type: 'table', cols: ['Item', 'Status', 'Notes'], rows: [['', '', '']] },
    { key: 'yours', label: 'yours', type: 'table', cols: ['Item', 'Status', 'Notes'], rows: [['', '', '']] },
    { key: 'expenses', label: 'expenses', type: 'table', cols: ['Item', 'Amount', 'Notes'], rows: [['', '', '']] },
    { key: 'before-aps', label: "'before' at All Points East \u2014 [sponsor]", type: 'table', cols: ['Item', 'Status', 'Notes'], rows: [['', '', '']] },

     pages like the rate sheet that aren't just a flat table. Grows the
     same way — "+ Add section" / "+ add item" at every level.
     ===================================================================== */
  function docShellHTML() {
    return '<main class="doc"><div id="doc-body"></div></main>';
  }
  function itemRef(items, path) {
    let arr = items;
    for (let i = 0; i < path.length - 1; i++) arr = arr[path[i]].sub;
    return { arr: arr, idx: path[path.length - 1] };
  }
  function docListHTML(items, bi, prefix) {
    return items.map((it, i) => {
      const path = prefix ? prefix + '.' + i : '' + i;
      let html = '<li class="doc-li' + (prefix ? ' sub' : '') + '">' +
        '<span class="doc-li-text" contenteditable oninput="docSetItem(' + bi + ',\'' + path + '\', this.innerHTML)">' + it.html + '</span>' +
        '<button class="doc-li-del" onclick="docDelItem(' + bi + ',\'' + path + '\')" title="Remove">\u00d7</button>' +
        '</li>';
      if (it.sub && it.sub.length) html += '<ul class="doc-ul">' + docListHTML(it.sub, bi, path) + '</ul>';
      return html;
    }).join('');
  }
  function docTableHTML(b, bi) {
    return '<div class="table-wrap doc-table"><table><thead><tr>' +
      b.cols.map((col, ci) => '<th contenteditable oninput="docRenameCol(' + bi + ',' + ci + ', this.textContent)">' + esc(col) + '</th>').join('') +
      '<th class="row-del-cell"></th></tr></thead><tbody>' +
      b.rows.map((row, ri) => '<tr>' + row.map((cell, ci) =>
        '<td contenteditable data-ph="\u2014" oninput="docSetCell(' + bi + ',' + ri + ',' + ci + ', this.innerHTML)">' + cell + '</td>'
      ).join('') + '<td class="row-del-cell"><button class="row-del" onclick="docDelRow(' + bi + ',' + ri + ')" title="Remove row">\u00d7</button></td></tr>').join('') +
      '</tbody></table></div>' +
      '<div class="doc-addblock" onclick="docAddRow(' + bi + ')">+ New row</div>';
  }
  function docHTML(blocks) {
    return blocks.map((b, bi) => {
      if (b.t === 'h2') return '<div class="doc-h2" contenteditable oninput="docSetBlock(' + bi + ', this.innerHTML)">' + b.html + '</div>';
      if (b.t === 'h3') return '<div class="doc-h3" contenteditable oninput="docSetBlock(' + bi + ', this.innerHTML)">' + b.html + '</div>';
      if (b.t === 'p') return '<div class="doc-p" contenteditable oninput="docSetBlock(' + bi + ', this.innerHTML)">' + b.html + '</div>';
      if (b.t === 'hr') return '<hr class="doc-hr">';
      if (b.t === 'table') return docTableHTML(b, bi);
      if (b.t === 'ul') return '<ul class="doc-ul">' + docListHTML(b.items, bi) + '</ul>' +
        '<div class="doc-additem" onclick="docAddItem(' + bi + ')">+ add item</div>';
      return '';
    }).join('') + '<div class="doc-addblock" onclick="docAddBlock()">+ Add section</div>';
  }
  function renderDoc() { document.getElementById('doc-body').innerHTML = docHTML(curPage().blocks); }
  function docSetBlock(bi, html) { curPage().blocks[bi].html = html; savePages(); }
  function docSetItem(bi, pathStr, html) {
    const r = itemRef(curPage().blocks[bi].items, pathStr.split('.').map(Number));
    r.arr[r.idx].html = html; savePages();
  }
  function docDelItem(bi, pathStr) {
    const r = itemRef(curPage().blocks[bi].items, pathStr.split('.').map(Number));
    r.arr.splice(r.idx, 1); savePages(); renderDoc();
  }
  function docAddItem(bi) { curPage().blocks[bi].items.push({ html: 'New item' }); savePages(); renderDoc(); }
  function docAddBlock() { curPage().blocks.push({ t: 'p', html: 'Type something\u2026' }); savePages(); renderDoc(); }
  function docSetCell(bi, ri, ci, v) { curPage().blocks[bi].rows[ri][ci] = v; savePages(); }
  function docRenameCol(bi, ci, v) { curPage().blocks[bi].cols[ci] = v; savePages(); }
  function docAddRow(bi) { const b = curPage().blocks[bi]; b.rows.push(b.cols.map(() => '')); savePages(); renderDoc(); }
  function docDelRow(bi, ri) {
    const b = curPage().blocks[bi];
    b.rows.splice(ri, 1);
    if (!b.rows.length) b.rows.push(b.cols.map(() => ''));
    savePages(); renderDoc();
  }

  /* ---------- the router ---------- */
  function render() {
    renderCrumb();
    const app = document.getElementById('app');
    if (view === 'home') {
      app.innerHTML = homeHTML();
    } else if (view === 'job-sheet') {
      app.innerHTML = jobSheetShellHTML();
      renderNav(); renderTable();
    } else if (curPage() && curPage().type === 'doc') {
      app.innerHTML = docShellHTML();
      renderDoc();
    } else if (curPage()) {
      app.innerHTML = pageTableShellHTML();
      renderPageTable();
    } else {
      view = 'home'; localStorage.setItem('hq_view', 'home');
      app.innerHTML = homeHTML();
    }
  }

  render();
</script>
</body>
</html>
