services:
  - type: web
    name: studio-aa-hq
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 server.py"
    autoDeploy: true
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: ALLOWED_EMAILS
        value: aakash@studioaamgmt.com
      - key: ANTHROPIC_API_KEY
        sync: false
